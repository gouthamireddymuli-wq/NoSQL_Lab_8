version: "3.8"

# Lab 8.1 "Try It Yourself" – 3 Data Nodes + 1 Arbiter
# Usage:
#   docker compose up -d
#   Then run init_replicaset_arbiter.js via mongosh.

services:
  mongo-rs0-1:
    image: mongo:7
    container_name: mongo-rs0-1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - rs0_data1:/data/db
    healthcheck:
      test: echo 'db.runCommand({ping:1})' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rs0_net

  mongo-rs0-2:
    image: mongo:7
    container_name: mongo-rs0-2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27018"]
    ports:
      - "27018:27018"
    volumes:
      - rs0_data2:/data/db
    healthcheck:
      test: echo 'db.runCommand({ping:1})' | mongosh --port 27018 --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rs0_net

  mongo-arbiter:
    image: mongo:7
    container_name: mongo-arbiter
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27020"]
    ports:
      - "27020:27020"
    # Arbiters have no meaningful data, so no persistent volume is needed.
    networks:
      - rs0_net

volumes:
  rs0_data1:
  rs0_data2:

networks:
  rs0_net:
    driver: bridge
